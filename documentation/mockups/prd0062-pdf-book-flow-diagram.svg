<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PRD0062 PDF Book creation flow</title>
  <desc id="desc">Five-step teacher flow from preparing PDF files through publishing Unit 1, with a Book plan creating Sections, Units, planned Activity slots, and initial page connections before Activity content is added.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#667085"/></marker>
    <style>
      .bg{fill:#f8f9fa}.box{fill:#fff;stroke:#cfd6df;stroke-width:1.5}.focus{fill:#f1efff;stroke:#766ce7;stroke-width:1.5}.safe{fill:#eef8f2;stroke:#70a98b;stroke-width:1.5}.warn{fill:#fff8e8;stroke:#c69a49;stroke-width:1.5}.t{font-family:Inter,Arial,sans-serif;fill:#2b3437}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#667085}.tiny{font-size:11px;fill:#667085}.line{stroke:#667085;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="520"/>

  <g class="t">
    <rect class="box" x="25" y="48" width="190" height="108" rx="10"/>
    <text class="h" x="120" y="78" text-anchor="middle">1. Prepare files</text>
    <text class="s" x="120" y="105" text-anchor="middle">Choose PDF mode</text>
    <text class="s" x="120" y="125" text-anchor="middle">Inspect + verify source</text>
    <text class="s" x="120" y="145" text-anchor="middle">Upload/attach safely</text>

    <rect class="focus" x="255" y="30" width="270" height="145" rx="10"/>
    <text class="h" x="390" y="61" text-anchor="middle">2. Set up your Book</text>
    <text class="s" x="390" y="88" text-anchor="middle">Create / import Book plan</text>
    <text class="s" x="390" y="108" text-anchor="middle">Sections → Units</text>
    <text class="s" x="390" y="128" text-anchor="middle">Planned Activity slots</text>
    <text class="s" x="390" y="148" text-anchor="middle">Add exact Activity content</text>
    <text class="tiny" x="390" y="167" text-anchor="middle">Unit 1 is the current publish-first scope</text>

    <rect class="box" x="565" y="48" width="205" height="108" rx="10"/>
    <text class="h" x="667" y="78" text-anchor="middle">3. Connect PDF pages</text>
    <text class="s" x="667" y="105" text-anchor="middle">Review suggested mappings</text>
    <text class="s" x="667" y="125" text-anchor="middle">Adjust trusted pages</text>
    <text class="s" x="667" y="145" text-anchor="middle">Validate physical range</text>

    <rect class="box" x="810" y="48" width="205" height="108" rx="10"/>
    <text class="h" x="912" y="78" text-anchor="middle">4. Review &amp; preview</text>
    <text class="s" x="912" y="105" text-anchor="middle">Save + validate draft</text>
    <text class="s" x="912" y="125" text-anchor="middle">Student preview</text>
    <text class="s" x="912" y="145" text-anchor="middle">Approve preview</text>

    <rect class="safe" x="1055" y="48" width="120" height="108" rx="10"/>
    <text class="h" x="1115" y="78" text-anchor="middle">5. Publish</text>
    <text class="s" x="1115" y="105" text-anchor="middle">Confirm rights</text>
    <text class="s" x="1115" y="125" text-anchor="middle">Publish Unit 1</text>
    <text class="s" x="1115" y="145" text-anchor="middle">Later Units private</text>

    <line class="line" x1="215" y1="102" x2="255" y2="102"/>
    <line class="line" x1="525" y1="102" x2="565" y2="102"/>
    <line class="line" x1="770" y1="102" x2="810" y2="102"/>
    <line class="line" x1="1015" y1="102" x2="1055" y2="102"/>

    <rect class="box" x="250" y="255" width="285" height="170" rx="10"/>
    <text class="h" x="392" y="287" text-anchor="middle">Step 2 master / detail</text>
    <text class="s" x="275" y="320">Book outline</text>
    <text class="tiny" x="290" y="344">Section 1</text>
    <text class="tiny" x="305" y="364">Unit 1 · Publishing first</text>
    <text class="tiny" x="305" y="384">Unit 2 · Later</text>
    <text class="s" x="405" y="320">Selected Unit detail</text>
    <text class="tiny" x="420" y="344">Planned Activity 1</text>
    <text class="tiny" x="420" y="364">Content needed</text>
    <text class="tiny" x="420" y="384">Suggested pages 5–6</text>
    <line class="line" x1="390" y1="175" x2="390" y2="255"/>

    <rect class="warn" x="585" y="255" width="295" height="170" rx="10"/>
    <text class="h" x="732" y="287" text-anchor="middle">Recovery remains fail-closed</text>
    <text class="s" x="610" y="320">Invalid Book plan</text>
    <text class="tiny" x="625" y="340">Keep current plan; show technical details</text>
    <text class="s" x="610" y="370">Activity conflict</text>
    <text class="tiny" x="625" y="390">Explicit keep/replace decision</text>
    <text class="s" x="610" y="420">Service / authorization failure</text>
    <text class="tiny" x="625" y="440">No unsafe fallback or bypass</text>

    <rect class="box" x="925" y="255" width="250" height="170" rx="10"/>
    <text class="h" x="1050" y="287" text-anchor="middle">Progressive disclosure</text>
    <text class="s" x="950" y="320">Default</text>
    <text class="tiny" x="965" y="340">Sections, Units, Activities, PDF pages</text>
    <text class="s" x="950" y="370">More options</text>
    <text class="tiny" x="965" y="390">Replace, reorder, reference pages</text>
    <text class="s" x="950" y="420">Technical details</text>
    <text class="tiny" x="965" y="440">JSON, keys, revisions, validator paths</text>
  </g>
</svg>
