<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>IELTS Reading V2 Build Test</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Georgia:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#4f5254",
                        "on-tertiary-fixed-variant": "#444749",
                        "on-primary": "#ffffff",
                        "on-surface": "#0b1c30",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#80d5cb",
                        "surface-container-low": "#eff4ff",
                        "surface-tint": "#006a63",
                        "on-surface-variant": "#3e4947",
                        "secondary-fixed-dim": "#bcc7de",
                        "surface-dim": "#cbdbf5",
                        "inverse-surface": "#213145",
                        "inverse-primary": "#80d5cb",
                        "surface-container": "#e5eeff",
                        "on-tertiary": "#ffffff",
                        "on-background": "#0b1c30",
                        "secondary": "#545f73",
                        "outline": "#6e7977",
                        "on-primary-fixed": "#00201d",
                        "on-primary-container": "#a3faef",
                        "on-tertiary-container": "#e9ebed",
                        "tertiary-container": "#676a6c",
                        "on-secondary-fixed": "#111c2d",
                        "surface-container-high": "#dce9ff",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#005c55",
                        "on-secondary-fixed-variant": "#3c475a",
                        "on-primary-fixed-variant": "#00504a",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-bright": "#f8f9ff",
                        "surface": "#f8f9ff",
                        "primary-fixed": "#9cf2e8",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "secondary-fixed": "#d8e3fb",
                        "tertiary-fixed": "#e0e3e5",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#d3e4fe",
                        "primary-container": "#0f766e",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#d3e4fe",
                        "background": "#f8f9ff",
                        "outline-variant": "#bdc9c6",
                        "on-tertiary-fixed": "#191c1e",
                        "error": "#ba1a1a",
                        "secondary-container": "#d5e0f8",
                        "on-secondary-container": "#586377"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xs": "8px",
                        "xl": "32px",
                        "lg": "24px",
                        "md": "16px",
                        "sm": "12px",
                        "gutter": "24px",
                        "container-max": "1280px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "label-bold": ["Inter"],
                        "h3": ["Inter"],
                        "h1": ["Inter"],
                        "code": ["monospace"],
                        "body-reading": ["Georgia"],
                        "label-sm": ["Inter"],
                        "h2": ["Inter"],
                        "body-ui": ["Inter"]
                    },
                    "fontSize": {
                        "label-bold": ["14px", { "lineHeight": "1", "fontWeight": "600" }],
                        "h3": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "code": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-reading": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "h2": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-ui": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-ui min-h-screen flex flex-col">
<!-- TopNavBar -->
<header class="bg-white dark:bg-slate-900 docked full-width top-0 border-b border-b border-slate-200 dark:border-slate-800 flat no shadows flex justify-between items-center px-6 h-16 w-full z-10 shrink-0">
<div class="flex items-center gap-6 h-full">
<span class="text-lg font-bold text-teal-700 dark:text-teal-500 font-['Inter'] font-black">IELTS Authoring</span>
<nav class="flex h-full gap-6">
<!-- Active Item -->
<button class="font-['Inter'] text-sm font-medium tracking-tight text-teal-700 dark:text-teal-400 border-b-2 border-teal-700 dark:border-teal-400 pb-4 mt-auto h-auto translate-y-[1px] hover:text-teal-600 dark:hover:text-teal-300 transition-colors cursor-pointer active:opacity-70 transition-opacity">Passage 1</button>
<!-- Inactive Items -->
<button class="font-['Inter'] text-sm font-medium tracking-tight text-slate-500 dark:text-slate-400 pb-4 mt-auto h-auto translate-y-[1px] hover:text-teal-600 dark:hover:text-teal-300 transition-colors cursor-pointer active:opacity-70 transition-opacity">Passage 2</button>
<button class="font-['Inter'] text-sm font-medium tracking-tight text-slate-500 dark:text-slate-400 pb-4 mt-auto h-auto translate-y-[1px] hover:text-teal-600 dark:hover:text-teal-300 transition-colors cursor-pointer active:opacity-70 transition-opacity">Passage 3</button>
</nav>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-2 text-slate-500">
<button class="p-2 hover:bg-slate-100 rounded-full transition-colors"><span class="material-symbols-outlined">settings</span></button>
<button class="p-2 hover:bg-slate-100 rounded-full transition-colors"><span class="material-symbols-outlined">help_outline</span></button>
</div>
<div class="h-6 w-px bg-slate-200"></div>
<button class="font-label-bold text-label-bold text-secondary border border-outline hover:bg-slate-50 px-4 py-2 rounded">Save Draft</button>
<button class="font-label-bold text-label-bold text-on-primary bg-primary hover:bg-primary-fixed-variant px-4 py-2 rounded">Publish</button>
<div class="h-8 w-8 rounded-full bg-slate-200 overflow-hidden ml-2 flex items-center justify-center border border-slate-300">
<span class="material-symbols-outlined text-slate-400">person</span>
</div>
</div>
</header>
<!-- Main Workspace -->
<main class="flex-1 flex overflow-hidden">
<!-- Left Panel: Reading Passage Editor -->
<section class="flex-1 overflow-y-auto border-r border-outline-variant bg-surface-container-lowest">
<div class="max-w-[800px] mx-auto py-xl px-lg">
<div class="mb-lg">
<input class="font-h1 text-h1 text-on-surface w-full bg-transparent border-none focus:ring-0 p-0 mb-sm" placeholder="Passage Title" type="text" value="Reading Passage 1"/>
<input class="font-body-ui text-body-ui text-on-surface-variant w-full bg-transparent border-none focus:ring-0 p-0 italic" type="text" value="You should spend about 20 minutes on Questions 1-13, which are based on Reading Passage 1 below."/>
</div>
<div class="font-body-reading text-body-reading text-on-surface leading-relaxed space-y-md">
<textarea class="w-full h-32 bg-transparent border border-transparent hover:border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded p-2 resize-y font-body-reading text-body-reading" placeholder="Start typing passage paragraph...">The history of human migration is a complex tapestry woven with threads of environmental pressure, technological advancement, and sheer curiosity. From the initial exodus out of Africa to the peopling of the Americas, our ancestors demonstrated an extraordinary ability to adapt to diverse and often hostile environments.</textarea>
<textarea class="w-full h-48 bg-transparent border border-transparent hover:border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded p-2 resize-y font-body-reading text-body-reading">One of the most fascinating aspects of this journey is the role of maritime technology. The colonization of Remote Oceania, for example, required sophisticated navigation skills and sturdy watercraft capable of traversing vast open ocean distances. These ancient mariners relied on a deep understanding of celestial bodies, ocean currents, and wind patterns, passing down their knowledge through oral traditions rather than written maps.</textarea>
<textarea class="w-full h-32 bg-transparent border border-transparent hover:border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded p-2 resize-y font-body-reading text-body-reading">Furthermore, the development of agriculture marked a significant turning point, allowing populations to settle and grow exponentially. This transition from nomadic hunter-gatherer societies to settled agrarian communities brought about profound changes in social structure, land ownership, and ultimately, the rise of early civilizations.</textarea>
</div>
</div>
</section>
<!-- Right Panel: Judgement Task Editors -->
<aside class="w-[500px] flex-shrink-0 bg-surface-container-low overflow-y-auto border-l border-outline-variant">
<div class="p-lg space-y-lg">
<!-- Task 1: True/False/Not Given -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
<div class="flex justify-between items-start mb-md">
<div>
<input class="font-h3 text-h3 text-on-surface bg-transparent border-none focus:ring-0 p-0 w-full mb-base" type="text" value="Questions 1-5"/>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider bg-primary-container/10 px-2 py-1 rounded">True / False / Not Given</span>
</div>
<div class="flex gap-2 text-on-surface-variant">
<button class="p-1 hover:bg-surface-variant rounded"><span class="material-symbols-outlined text-[20px]">drag_indicator</span></button>
<button class="p-1 hover:bg-surface-variant rounded"><span class="material-symbols-outlined text-[20px]">more_vert</span></button>
</div>
</div>
<div class="mb-md">
<textarea class="w-full bg-transparent border border-transparent hover:border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded p-2 font-body-ui text-body-ui text-on-surface-variant italic resize-none" rows="2">Do the following statements agree with the information given in Reading Passage 1?</textarea>
</div>
<div class="space-y-sm">
<!-- Statement Row 1 -->
<div class="border border-outline-variant rounded-lg p-sm bg-surface">
<div class="flex gap-sm items-start mb-sm">
<span class="font-label-bold text-label-bold text-on-surface-variant mt-1">1.</span>
<textarea class="flex-1 bg-transparent border border-transparent hover:border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded p-1 font-body-ui text-body-ui resize-none" rows="2">Early human migration was solely driven by the search for food.</textarea>
<button class="text-outline hover:text-error p-1"><span class="material-symbols-outlined text-[18px]">delete</span></button>
</div>
<div class="flex gap-sm pl-[28px]">
<button class="font-label-sm text-label-sm px-3 py-1.5 rounded-full bg-primary text-on-primary border border-primary">TRUE</button>
<button class="font-label-sm text-label-sm px-3 py-1.5 rounded-full bg-transparent text-secondary border border-outline-variant hover:bg-surface-variant">FALSE</button>
<button class="font-label-sm text-label-sm px-3 py-1.5 rounded-full bg-transparent text-secondary border border-outline-variant hover:bg-surface-variant">NOT GIVEN</button>
</div>
</div>
<!-- Statement Row 2 -->
<div class="border border-outline-variant rounded-lg p-sm bg-surface">
<div class="flex gap-sm items-start mb-sm">
<span class="font-label-bold text-label-bold text-on-surface-variant mt-1">2.</span>
<textarea class="flex-1 bg-transparent border border-transparent hover:border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded p-1 font-body-ui text-body-ui resize-none" rows="2">The colonization of Remote Oceania required physical maps.</textarea>
<button class="text-outline hover:text-error p-1"><span class="material-symbols-outlined text-[18px]">delete</span></button>
</div>
<div class="flex gap-sm pl-[28px]">
<button class="font-label-sm text-label-sm px-3 py-1.5 rounded-full bg-transparent text-secondary border border-outline-variant hover:bg-surface-variant">TRUE</button>
<button class="font-label-sm text-label-sm px-3 py-1.5 rounded-full bg-transparent text-secondary border border-outline-variant hover:bg-surface-variant">FALSE</button>
<button class="font-label-sm text-label-sm px-3 py-1.5 rounded-full bg-transparent text-secondary border border-outline-variant hover:bg-surface-variant">NOT GIVEN</button>
</div>
</div>
</div>
<button class="mt-md font-label-bold text-label-bold text-primary flex items-center gap-1 hover:underline p-1">
<span class="material-symbols-outlined text-[18px]">add</span> Add Statement
                    </button>
</div>
<!-- Task 2: Yes/No/Not Given (Validation State) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md ring-1 ring-error">
<div class="flex justify-between items-start mb-md">
<div>
<input class="font-h3 text-h3 text-on-surface bg-transparent border-none focus:ring-0 p-0 w-full mb-base" type="text" value="Questions 6-10"/>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider bg-primary-container/10 px-2 py-1 rounded">Yes / No / Not Given</span>
</div>
<div class="flex gap-2 text-on-surface-variant">
<button class="p-1 hover:bg-surface-variant rounded"><span class="material-symbols-outlined text-[20px]">drag_indicator</span></button>
<button class="p-1 hover:bg-surface-variant rounded"><span class="material-symbols-outlined text-[20px]">more_vert</span></button>
</div>
</div>
<div class="mb-md">
<textarea class="w-full bg-transparent border border-transparent hover:border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded p-2 font-body-ui text-body-ui text-on-surface-variant italic resize-none" rows="2">Do the following statements agree with the claims of the writer in Reading Passage 1?</textarea>
</div>
<div class="space-y-sm">
<!-- Statement Row with Error -->
<div class="border border-error rounded-lg p-sm bg-error-container/20">
<div class="flex gap-sm items-start mb-sm">
<span class="font-label-bold text-label-bold text-error mt-1">6.</span>
<textarea class="flex-1 bg-transparent border border-transparent hover:border-error focus:border-error focus:ring-1 focus:ring-error rounded p-1 font-body-ui text-body-ui resize-none" rows="2">Agriculture led to a decrease in global population density.</textarea>
<button class="text-outline hover:text-error p-1"><span class="material-symbols-outlined text-[18px]">delete</span></button>
</div>
<div class="flex gap-sm pl-[28px] mb-xs">
<button class="font-label-sm text-label-sm px-3 py-1.5 rounded-full bg-transparent text-secondary border border-error hover:bg-error-container/40">YES</button>
<button class="font-label-sm text-label-sm px-3 py-1.5 rounded-full bg-transparent text-secondary border border-error hover:bg-error-container/40">NO</button>
<button class="font-label-sm text-label-sm px-3 py-1.5 rounded-full bg-transparent text-secondary border border-error hover:bg-error-container/40">NOT GIVEN</button>
</div>
<div class="pl-[28px] flex items-center gap-1 text-error">
<span class="material-symbols-outlined text-[16px] icon-fill">error</span>
<span class="font-label-sm text-label-sm">Please select a correct answer for this statement.</span>
</div>
</div>
</div>
<button class="mt-md font-label-bold text-label-bold text-primary flex items-center gap-1 hover:underline p-1">
<span class="material-symbols-outlined text-[18px]">add</span> Add Statement
                    </button>
</div>
</div>
</aside>
</main>
</body></html>
