name: Release Promotion
# Manual dispatch is the protected-main entry point for Phase 3 promotion.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Publish a prepared release or resume an existing operation'
        required: true
        default: publish
        type: choice
        options:
          - publish
          - verify-existing
      operation_id:
        description: 'Existing Hosting operation UUID when operation=verify-existing'
        required: false
        type: string
      objective:
        description: 'Product objective for this release; technical bindings are derived automatically'
        required: true
        type: string
      verification_tag:
        description: 'GitHub prerelease verification bundle tag produced by Codex for application changes'
        required: false
        type: string
      verification_sha256:
        description: 'SHA-256 of the retained verification bundle asset'
        required: false
        type: string

concurrency:
  group: luyentap-hosting-production
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.repository == 'iamhuwng/autoresync' && github.ref == 'refs/heads/main' && inputs.operation == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_sha256: ${{ steps.artifact.outputs.sha256 }}
      assessment_publishable: ${{ steps.assessment.outputs.publishable }}
      card_sha256: ${{ steps.release-card.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact protected event source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git update-ref refs/heads/main "$GITHUB_SHA"
          test "$(git rev-parse refs/heads/main)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require the read-only Firebase federation configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.LUYENTAP_RELEASE_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.LUYENTAP_RELEASE_GOOGLE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test -n "$SERVICE_ACCOUNT"
      - uses: ./.github/actions/assert-oidc-cleanup
        with:
          path: ${{ runner.temp }}/gha-creds.json
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.LUYENTAP_RELEASE_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.LUYENTAP_RELEASE_GOOGLE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Keep federation credentials outside the checkout
        run: node scripts/relocate-oidc-credentials.mjs
      - name: Verify relocated federation with Google and Firebase CLIs
        run: |
          set -euo pipefail
          gcloud auth print-access-token --quiet >/dev/null
          node scripts/tooling-where.mjs --exec firebase hosting:sites:list --project temp-a1437 --json >/dev/null
      - name: Prove the preflight identity can read Hosting metadata
        run: node scripts/tooling-where.mjs --exec firebase hosting:sites:list --project temp-a1437 --json
      - name: Materialize the isolated production environment
        env:
          PRODUCTION_ENV: ${{ secrets.LUYENTAP_RELEASE_ENV }}
          QUALIFICATION_HOSTING_SITE: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_HOSTING_SITE }}
          QUALIFICATION_API_KEY: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_API_KEY }}
          QUALIFICATION_AUTH_DOMAIN: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_AUTH_DOMAIN }}
          QUALIFICATION_DATABASE_URL: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_DATABASE_URL }}
          QUALIFICATION_PROJECT_ID: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_PROJECT_ID }}
          QUALIFICATION_STORAGE_BUCKET: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_STORAGE_BUCKET }}
          QUALIFICATION_MESSAGING_SENDER_ID: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_MESSAGING_SENDER_ID }}
          QUALIFICATION_APP_ID: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_ENV"
          test -n "$QUALIFICATION_HOSTING_SITE"
          test -n "$QUALIFICATION_API_KEY"
          test -n "$QUALIFICATION_AUTH_DOMAIN"
          test -n "$QUALIFICATION_DATABASE_URL"
          test -n "$QUALIFICATION_PROJECT_ID"
          test -n "$QUALIFICATION_STORAGE_BUCKET"
          test -n "$QUALIFICATION_MESSAGING_SENDER_ID"
          test -n "$QUALIFICATION_APP_ID"
          umask 077
          printf '%s\n' "$PRODUCTION_ENV" > "$RUNNER_TEMP/.env.production"
          cat >> "$RUNNER_TEMP/.env.production" <<EOF
          VITE_FIREBASE_QUALIFICATION_API_KEY=$QUALIFICATION_API_KEY
          VITE_FIREBASE_QUALIFICATION_HOSTING_SITE=$QUALIFICATION_HOSTING_SITE
          VITE_FIREBASE_QUALIFICATION_AUTH_DOMAIN=$QUALIFICATION_AUTH_DOMAIN
          VITE_FIREBASE_QUALIFICATION_DATABASE_URL=$QUALIFICATION_DATABASE_URL
          VITE_FIREBASE_QUALIFICATION_PROJECT_ID=$QUALIFICATION_PROJECT_ID
          VITE_FIREBASE_QUALIFICATION_STORAGE_BUCKET=$QUALIFICATION_STORAGE_BUCKET
          VITE_FIREBASE_QUALIFICATION_MESSAGING_SENDER_ID=$QUALIFICATION_MESSAGING_SENDER_ID
          VITE_FIREBASE_QUALIFICATION_APP_ID=$QUALIFICATION_APP_ID
          EOF
      - name: Derive release inputs from the exact source and live Hosting
        env:
          GH_TOKEN: ${{ github.token }}
          OBJECTIVE: ${{ inputs.objective }}
          LUYENTAP_RELEASE_VERIFICATION_BUNDLE_TAG: ${{ inputs.verification_tag }}
          LUYENTAP_RELEASE_VERIFICATION_BUNDLE_SHA256: ${{ inputs.verification_sha256 }}
        run: |
          set -euo pipefail
          node scripts/release-promotion.mjs --prepare --objective "$OBJECTIVE" --production-env-file "$RUNNER_TEMP/.env.production" --output "$RUNNER_TEMP/promotion-inputs.json"
          node scripts/release-promotion.mjs --export-inputs "$RUNNER_TEMP/promotion-inputs.json"
      - name: Build the candidate once
        env:
          LUYENTAP_PRODUCTION_ENV_FILE: ${{ runner.temp }}/.env.production
        run: npm run build:production -- --build-only
      - name: Record the retained artifact identity
        id: artifact
        run: echo "sha256=$(node scripts/release-promotion.mjs --artifact-digest)" >> "$GITHUB_OUTPUT"
      - name: Validate the exact public artifact before upload
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs/promises"; import { assertHostingArtifact } from "./scripts/release-archive.mjs"; const manifest=JSON.parse(await fs.readFile("dist/.well-known/luyentap-release.json","utf8")); await assertHostingArtifact(process.cwd(), manifest);'
      - name: Assess the exact source and live baseline
        id: assessment
        run: |
          set -euo pipefail
          args=(--mode release --target hosting --base "$LUYENTAP_RELEASE_BASE" --observe-hosting --env-fingerprint "$LUYENTAP_RELEASE_ENV_FINGERPRINT" --json --receipt "tmp/release-receipts/ci-${GITHUB_RUN_ID}.json")
          if test -n "${LUYENTAP_RELEASE_COMPATIBILITY_REVIEW_FILE:-}"; then args+=(--compatibility-review "$LUYENTAP_RELEASE_COMPATIBILITY_REVIEW_FILE"); fi
          set +e
          node scripts/release-check.mjs "${args[@]}"
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          decision="$(node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).decision)' "tmp/release-receipts/ci-${GITHUB_RUN_ID}.json")"
          echo "publishable=$([ "$decision" = PASS ] || [ "$decision" = NOT_APPLICABLE ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Execute the reviewed verification plan
        run: node scripts/release-promotion.mjs --run-verification --output "$RUNNER_TEMP/verification.json"
      - name: Preserve assessment and verification evidence
        env:
          LUYENTAP_RELEASE_INPUTS_FILE: ${{ runner.temp }}/promotion-inputs.json
        run: |
          set -euo pipefail
          mkdir -p tmp/release-card tmp/release-plan
          cp "$RUNNER_TEMP/promotion-inputs.json" tmp/release-card/promotion-inputs.json
          cp "$RUNNER_TEMP/verification.json" tmp/release-card/verification.json
          cp "tmp/release-receipts/ci-${GITHUB_RUN_ID}.json" tmp/release-card/assessment.json
          cp "tmp/release-receipts/ci-verification-plan.json" tmp/release-plan/ci-verification-plan.json
      - name: Build the source-bound release card
        id: release-card
        if: ${{ steps.assessment.outputs.publishable == 'true' }}
        env:
          LUYENTAP_RELEASE_INPUTS_FILE: ${{ runner.temp }}/promotion-inputs.json
          LUYENTAP_RELEASE_ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          LUYENTAP_RELEASE_VERIFICATION_FILE: ${{ runner.temp }}/verification.json
        run: |
          set -euo pipefail
          card="$RUNNER_TEMP/approved-release-card.json"
          node scripts/release-promotion.mjs --assessment "tmp/release-card/assessment.json" --output "$card" | tee "$RUNNER_TEMP/approved-release-card-sha256"
          mkdir -p "$RUNNER_TEMP/approved-release-card"
          cp "$card" "$RUNNER_TEMP/approved-release-card/release-card.json"
          cp "tmp/release-card/promotion-inputs.json" "$RUNNER_TEMP/approved-release-card/promotion-inputs.json"
          cp "tmp/release-card/verification.json" "$RUNNER_TEMP/approved-release-card/verification.json"
          cp "tmp/release-card/assessment.json" "$RUNNER_TEMP/approved-release-card/assessment.json"
          cat "$card" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256=$(cat "$RUNNER_TEMP/approved-release-card-sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: luyentap-release-card-${{ github.run_id }}
          path: tmp/release-card
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: luyentap-hosting-artifact-${{ github.run_id }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: luyentap-verification-plan-${{ github.run_id }}
          path: tmp/release-plan
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ steps.assessment.outputs.publishable == 'true' }}
        with:
          name: luyentap-approved-release-card-${{ github.run_id }}
          path: ${{ runner.temp }}/approved-release-card
          if-no-files-found: error
          retention-days: 14

  promote:
    needs: [prepare]
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.card_sha256 != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://kahut1.web.app
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the prepared exact source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git update-ref refs/heads/main "$GITHUB_SHA"
          test "$(git rev-parse refs/heads/main)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: luyentap-approved-release-card-${{ github.run_id }}
          path: ${{ runner.temp }}/release-card
      - uses: actions/download-artifact@v4
        with:
          name: luyentap-hosting-artifact-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: luyentap-verification-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/release-plan
      - name: Rehydrate the exact generated verification plan
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/release-plan/ci-verification-plan.json"
          test -n "$plan"
          mkdir -p tmp/release-receipts
          cp "$plan" tmp/release-receipts/ci-verification-plan.json
      - name: Verify the approved card and retained artifact
        env:
          EXPECTED_CARD_SHA256: ${{ needs.prepare.outputs.card_sha256 }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.prepare.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          card="$RUNNER_TEMP/release-card/release-card.json"
          test "$(sha256sum "$card" | cut -d' ' -f1)" = "$EXPECTED_CARD_SHA256"
          test "$(node scripts/release-promotion.mjs --check-card "$card")" = "$EXPECTED_CARD_SHA256"
          test "$(node scripts/release-promotion.mjs --require-verification "$card")" = "$EXPECTED_CARD_SHA256"
          test "$(node scripts/release-promotion.mjs --artifact-digest)" = "$EXPECTED_ARTIFACT_SHA256"
      - name: Require the production Firebase federation configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test -n "$SERVICE_ACCOUNT"
      - uses: ./.github/actions/assert-oidc-cleanup
        with:
          path: ${{ runner.temp }}/gha-creds.json
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Keep federation credentials outside the checkout
        run: node scripts/relocate-oidc-credentials.mjs
      - name: Prove the pinned Firebase CLI identity before mutation
        run: node scripts/tooling-where.mjs --exec firebase hosting:sites:list --project temp-a1437 --json
      - name: Materialize the isolated production environment
        env:
          PRODUCTION_ENV: ${{ secrets.LUYENTAP_PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_ENV"
          umask 077
          printf '%s\n' "$PRODUCTION_ENV" > "$RUNNER_TEMP/.env.production"
      - name: Export the release-card bindings
        run: node scripts/release-promotion.mjs --export-env "$RUNNER_TEMP/release-card/release-card.json"
      - name: Re-observe the exact Hosting baseline immediately before mutation
        env:
          RECEIPT: ${{ runner.temp }}/pre-publish-baseline.json
        run: |
          set -euo pipefail
          args=(--mode release --target hosting --base "$LUYENTAP_RELEASE_BASE" --observe-hosting --env-fingerprint "$LUYENTAP_RELEASE_ENV_FINGERPRINT" --json --receipt "$RECEIPT")
          if test -n "${LUYENTAP_RELEASE_COMPATIBILITY_REVIEW_FILE:-}"; then args+=(--compatibility-review "$LUYENTAP_RELEASE_COMPATIBILITY_REVIEW_FILE"); fi
          node scripts/release-check.mjs "${args[@]}" >/dev/null
          node --input-type=module -e 'import fs from "node:fs"; const result=JSON.parse(fs.readFileSync(process.env.RECEIPT,"utf8")); if (!["PASS","NOT_APPLICABLE"].includes(result.decision) || result.observed?.revision !== process.env.LUYENTAP_RELEASE_BASE || result.observed?.fingerprint !== process.env.LUYENTAP_RELEASE_OBSERVED_FINGERPRINT) process.exit(1);'
      - name: Require protected main to remain the approved source
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$GITHUB_SHA"
      - name: Publish the retained artifact through the existing guarded route
        env:
          LUYENTAP_PRODUCTION_ENV_FILE: ${{ runner.temp }}/.env.production
          LUYENTAP_CHANGELOG_DIR: ${{ runner.temp }}/luyentap-changelog
          LUYENTAP_RELEASE_OPERATION_FILE: ${{ runner.temp }}/operation.json
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          npm run deploy:hosting -- --deploy-retained 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          status=${PIPESTATUS[0]}
          set -e
          operation=""
          if test -f "$RUNNER_TEMP/operation.json"; then operation="$(OPERATION_FILE="$RUNNER_TEMP/operation.json" node --input-type=module -e 'import fs from "node:fs"; try { const value=JSON.parse(fs.readFileSync(process.env.OPERATION_FILE,"utf8")); if (/^[0-9a-f-]{36}$/.test(value.operationId || "")) process.stdout.write(value.operationId); } catch {}')"; fi
          if test -z "$operation"; then operation="$(sed -nE 's/^\[Changelog\] ([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}):.*/\1/p' "$RUNNER_TEMP/deploy.log" | head -1)"; fi
          if test -z "$operation"; then operation="$(sed -n 's/^\[Release\] operation=//p' "$RUNNER_TEMP/deploy.log" | tail -1)"; fi
          if test -z "$operation"; then operation="$(sed -nE 's/^Release ([0-9a-f-]{36}):.*/\1/p' "$RUNNER_TEMP/deploy.log" | tail -1)"; fi
          if test -n "$operation"; then
            echo "Hosting operation: $operation" >> "$GITHUB_STEP_SUMMARY"
            echo "$operation" > "$RUNNER_TEMP/operation-id"
          fi
          exit "$status"
      - name: Capture durable Changelog reconciliation evidence
        if: ${{ always() }}
        run: |
          git diff --binary -- documentation/architecture/changelog documentation/architecture/master_changelog.md > "$RUNNER_TEMP/changelog-reconciliation.patch" || true
          if test -s "$RUNNER_TEMP/operation-id"; then
           operation="$(cat "$RUNNER_TEMP/operation-id")"
            REQUEST="$RUNNER_TEMP/changelog-integration-request.json" OPERATION_ID="$operation" CARD="$RUNNER_TEMP/release-card/release-card.json" PATCH="$RUNNER_TEMP/changelog-reconciliation.patch" node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; const card=JSON.parse(fs.readFileSync(process.env.CARD,"utf8")); const patch=fs.readFileSync(process.env.PATCH); fs.writeFileSync(process.env.REQUEST, `${JSON.stringify({schemaVersion:1,status:"pending-protected-main-integration",operationId:process.env.OPERATION_ID,source:card.source,baseline:card.baseline,patchSha256:crypto.createHash("sha256").update(patch).digest("hex"),requiredAction:"Apply the retained patch through the protected-main review/integration path; this record is not canonical reconciliation.",generatedAt:new Date().toISOString()},null,2)}\n`);'
            if test -s "$RUNNER_TEMP/changelog-reconciliation.patch"; then
              gh release upload "hosting-operation-$operation" "$RUNNER_TEMP/changelog-reconciliation.patch" --repo "$GITHUB_REPOSITORY"
            fi
            if test -f "$RUNNER_TEMP/operation.json"; then
              gh release upload "hosting-operation-$operation" "$RUNNER_TEMP/operation.json" --repo "$GITHUB_REPOSITORY"
            fi
            gh release upload "hosting-operation-$operation" "$RUNNER_TEMP/changelog-integration-request.json" --repo "$GITHUB_REPOSITORY"
          fi
           rm -rf tmp/release-result
           mkdir -p tmp/release-result
           for file in release-card/release-card.json operation-id operation.json pre-publish-baseline.json changelog-reconciliation.patch changelog-integration-request.json luyentap-changelog/state.json; do
             if test -f "$RUNNER_TEMP/$file"; then
               mkdir -p "tmp/release-result/$(dirname "$file")"
               cp "$RUNNER_TEMP/$file" "tmp/release-result/$file"
             fi
           done
           if test -d documentation/architecture/changelog; then cp -R documentation/architecture/changelog tmp/release-result/; fi
           if test -f documentation/architecture/master_changelog.md; then cp documentation/architecture/master_changelog.md tmp/release-result/; fi
      - name: Open the protected-main Changelog integration PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test ! -s "$RUNNER_TEMP/operation-id" || test ! -s "$RUNNER_TEMP/changelog-reconciliation.patch"; then
            echo 'No Changelog patch is waiting for canonical integration.'
            exit 0
          fi
          if test ! -f "$RUNNER_TEMP/operation.json"; then
            echo 'Publication outcome record is missing; no Changelog integration PR will be opened.'
            exit 0
          fi
          operation_status="$(node --input-type=module -e 'import fs from "node:fs"; const value=JSON.parse(fs.readFileSync(process.env.OPERATION_FILE,"utf8")); process.stdout.write(value.status || "")' OPERATION_FILE="$RUNNER_TEMP/operation.json")"
          case "$operation_status" in
            published-verified|changelog-pending|changelog-pending-integration) ;;
            *) echo "Publication/live verification status is $operation_status; no Changelog integration PR will be opened."; exit 0 ;;
          esac
          operation="$(cat "$RUNNER_TEMP/operation-id")"
          branch="codex/changelog-integration-$operation"
          git fetch origin main --depth=1
          git switch -c "$branch" "$GITHUB_SHA"
          git apply "$RUNNER_TEMP/changelog-reconciliation.patch"
          git add -- documentation/architecture/changelog documentation/architecture/master_changelog.md
          if git diff --cached --quiet; then
            echo 'Changelog patch produced no canonical changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(release): reconcile Hosting operation $operation"
          git push origin "HEAD:$branch"
          pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --json url --jq '.[0].url' | head -1)"
          if test -z "$pr_url"; then
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "docs(release): reconcile Hosting operation $operation" --body "Publication and live verification status: `$operation_status` for Hosting operation `$operation`. Apply this protected-main follow-up to reconcile the retained Master Changelog patch. This PR is documentation reconciliation only and does not authorize another publication.")"
          fi
          echo "$pr_url" | tee "$RUNNER_TEMP/changelog-pr-url"
          echo "Changelog integration PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain Changelog integration PR identity
        if: ${{ always() }}
        run: |
          if test -f "$RUNNER_TEMP/changelog-pr-url"; then cp "$RUNNER_TEMP/changelog-pr-url" tmp/release-result/; fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: luyentap-release-result-${{ github.run_id }}
          path: tmp/release-result
          if-no-files-found: error
          retention-days: 30

  recover:
    if: ${{ github.repository == 'iamhuwng/autoresync' && github.ref == 'refs/heads/main' && inputs.operation == 'verify-existing' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://kahut1.web.app
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require a concrete existing operation
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          [[ "$OPERATION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
      - name: Require the production Firebase federation configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test -n "$SERVICE_ACCOUNT"
      - uses: ./.github/actions/assert-oidc-cleanup
        with:
          path: ${{ runner.temp }}/gha-creds.json
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Keep federation credentials outside the checkout
        run: node scripts/relocate-oidc-credentials.mjs
      - name: Resume the same operation without rebuilding or redeploying
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
          LUYENTAP_CHANGELOG_DIR: ${{ runner.temp }}/luyentap-changelog
          LUYENTAP_RELEASE_OPERATION_FILE: ${{ runner.temp }}/operation.json
          GH_TOKEN: ${{ github.token }}
        run: npm run release:verify-existing -- "$OPERATION_ID"
      - name: Open the protected-main Changelog integration PR after recovery
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_FILE: ${{ runner.temp }}/operation.json
        run: |
          set -euo pipefail
          mkdir -p tmp/recovery-result
          git diff --binary -- documentation/architecture/changelog documentation/architecture/master_changelog.md > "$RUNNER_TEMP/changelog-reconciliation.patch" || true
          if test ! -s "$RUNNER_TEMP/changelog-reconciliation.patch" || test ! -f "$RUNNER_TEMP/operation.json"; then
            echo 'Recovery produced no Changelog patch requiring canonical integration.'
            exit 0
          fi
          operation_status="$(node --input-type=module -e 'import fs from "node:fs"; const value=JSON.parse(fs.readFileSync(process.env.OPERATION_FILE,"utf8")); process.stdout.write(value.status || "")')"
          case "$operation_status" in
            published-verified|changelog-pending|changelog-pending-integration) ;;
            *) echo "Recovery status is $operation_status; no Changelog integration PR will be opened."; exit 0 ;;
          esac
          operation="${{ inputs.operation_id }}"
          branch="codex/changelog-recovery-$operation"
          git fetch origin main --depth=1
          git switch -c "$branch" "$GITHUB_SHA"
          git apply "$RUNNER_TEMP/changelog-reconciliation.patch"
          git add -- documentation/architecture/changelog documentation/architecture/master_changelog.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(release): reconcile recovered Hosting operation $operation"
          git push origin "HEAD:$branch"
          pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --json url --jq '.[0].url' | head -1)"
          if test -z "$pr_url"; then
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "docs(release): reconcile recovered Hosting operation $operation" --body "Recovered publication/live verification status: `$operation_status`. Apply this protected-main follow-up to reconcile the retained Changelog patch. This PR does not authorize another publication.")"
          fi
          echo "$pr_url" >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/changelog-reconciliation.patch" tmp/recovery-result/
          echo "$pr_url" > tmp/recovery-result/changelog-pr-url
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: luyentap-release-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/luyentap-changelog/state.json
            tmp/recovery-result
          if-no-files-found: warn
          retention-days: 30
