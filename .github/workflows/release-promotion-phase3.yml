name: Release Promotion
# Manual dispatch is the protected-main entry point for serialized Hosting publication.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Check dependency health, plan or publish a release, or verify an existing operation'
        required: true
        default: publish
        type: choice
        options:
          - publish
          - health
          - plan
          - verify-existing
      objective:
        description: 'Optional release objective for Hosting release message and summary'
        required: false
        type: string
      operation_id:
        description: 'Hosting operation UUID to verify when operation=verify-existing'
        required: false
        type: string
      expected_manifest_sha256:
        description: 'Expected manifest SHA-256 to verify when operation=verify-existing'
        required: false
        type: string

concurrency:
  group: ${{ (inputs.operation == 'health' || inputs.operation == 'plan') && 'luyentap-hosting-read-only' || 'luyentap-hosting-production' }}
  cancel-in-progress: false

# Optional public inputs used only to reconcile a historical combined manifest hash.
# They are not build inputs or a requirement for a production-only baseline.
env:
  LUYENTAP_QUALIFICATION_FIREBASE_API_KEY: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_API_KEY }}
  LUYENTAP_QUALIFICATION_FIREBASE_HOSTING_SITE: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_HOSTING_SITE }}
  LUYENTAP_QUALIFICATION_FIREBASE_AUTH_DOMAIN: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_AUTH_DOMAIN }}
  LUYENTAP_QUALIFICATION_FIREBASE_DATABASE_URL: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_DATABASE_URL }}
  LUYENTAP_QUALIFICATION_FIREBASE_PROJECT_ID: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_PROJECT_ID }}
  LUYENTAP_QUALIFICATION_FIREBASE_STORAGE_BUCKET: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_STORAGE_BUCKET }}
  LUYENTAP_QUALIFICATION_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_MESSAGING_SENDER_ID }}
  LUYENTAP_QUALIFICATION_FIREBASE_APP_ID: ${{ vars.LUYENTAP_QUALIFICATION_FIREBASE_APP_ID }}

jobs:
  preflight:
    if: ${{ github.repository == 'iamhuwng/autoresync' && github.ref == 'refs/heads/main' && (inputs.operation == 'health' || inputs.operation == 'plan') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact protected main source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$GITHUB_SHA"
          git update-ref refs/heads/main "$GITHUB_SHA"
          test "$(git rev-parse refs/heads/main)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require the read-only Firebase federation configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.LUYENTAP_RELEASE_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.LUYENTAP_RELEASE_GOOGLE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test -n "$SERVICE_ACCOUNT"
      - uses: ./.github/actions/assert-oidc-cleanup
        with:
          path: ${{ runner.temp }}/gha-creds.json
      - id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.LUYENTAP_RELEASE_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.LUYENTAP_RELEASE_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/firebase.database
            https://www.googleapis.com/auth/userinfo.email
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Export scoped Firebase REST token
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_OAUTH_ACCESS_TOKEN"
          printf 'GOOGLE_OAUTH_ACCESS_TOKEN=%s\n' "$GOOGLE_OAUTH_ACCESS_TOKEN" >> "$GITHUB_ENV"
      - name: Keep federation credentials outside the checkout
        run: node scripts/relocate-oidc-credentials.mjs
      - name: Verify relocated federation with Google and Firebase CLIs
        if: ${{ inputs.operation == 'plan' }}
        run: |
          set -euo pipefail
          gcloud auth print-access-token --quiet >/dev/null
          node scripts/tooling-where.mjs --exec firebase hosting:sites:list --project temp-a1437 --json >/dev/null
      - name: Exercise all Hosting dependency reads with preflight federation
        if: ${{ inputs.operation == 'health' }}
        env:
          LUYENTAP_RELEASE_CLOUDFLARE_READ_TOKEN: ${{ secrets.LUYENTAP_RELEASE_CLOUDFLARE_READ_TOKEN }}
          LUYENTAP_HOSTING_READBACK_GOOGLE_ACCOUNT: ${{ vars.LUYENTAP_RELEASE_GOOGLE_SERVICE_ACCOUNT }}
          LUYENTAP_HOSTING_READBACK_GOOGLE_PROVIDER: ${{ vars.LUYENTAP_RELEASE_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          status=0
          node scripts/release-plan.mjs --dependency-health || status=$?
          if ! node scripts/tooling-where.mjs --exec firebase hosting:sites:list --project temp-a1437 --json >/dev/null 2>&1; then
            echo 'Firebase Hosting sites inventory failed. Check the federated Firebase CLI identity and firebasehosting.sites.get.'
            status=2
          fi
          exit "$status"
      - name: Materialize the read-only release plan environment
        if: ${{ inputs.operation == 'plan' }}
        env:
          RELEASE_ENV: ${{ secrets.LUYENTAP_RELEASE_ENV }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ENV"
          umask 077
          printf '%s\n' "$RELEASE_ENV" > "$RUNNER_TEMP/.env.production"
          test -s "$RUNNER_TEMP/.env.production"
      - name: Observe protected main and its live Hosting dependencies
        if: ${{ inputs.operation == 'plan' }}
        env:
          LUYENTAP_RELEASE_CLOUDFLARE_READ_TOKEN: ${{ secrets.LUYENTAP_RELEASE_CLOUDFLARE_READ_TOKEN }}
          LUYENTAP_HOSTING_READBACK_GOOGLE_ACCOUNT: ${{ vars.LUYENTAP_RELEASE_GOOGLE_SERVICE_ACCOUNT }}
          LUYENTAP_HOSTING_READBACK_GOOGLE_PROVIDER: ${{ vars.LUYENTAP_RELEASE_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          status=0
          node scripts/release-plan.mjs --json --env-file "$RUNNER_TEMP/.env.production" > "$RUNNER_TEMP/release-plan.json" || status=$?
          test "$status" -eq 0 -o "$status" -eq 2
          node --input-type=module - "$RUNNER_TEMP/release-plan.json" <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const plan = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const lines = [
            '## Read-only Hosting plan',
            `- Protected source \`${plan.source?.revision || 'unavailable'}\``,
            `- Source fingerprint \`${plan.source?.fingerprint || 'unavailable'}\``,
            `- Live base \`${plan.live?.revision || 'unavailable'}\``,
            `- Live fingerprint \`${plan.live?.fingerprint || 'unavailable'}\``,
            `- Dependencies fingerprint \`${plan.assessment?.hostingDependencies?.fingerprint || 'unavailable'}\``,
            ...plan.blockers.map(blocker => `- ${String(blocker).replace(/\s+/g, ' ')}`),
          ];
          console.log(lines.join('\n'));
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          }
          if (!plan.live || !plan.integration?.protectedMain?.matches || !plan.assessment
            || plan.assessment.findings.some(finding => ['BLOCKED', 'UNVERIFIED'].includes(finding.status))) process.exitCode = 1;
          NODE

  publish:
    if: ${{ github.repository == 'iamhuwng/autoresync' && github.ref == 'refs/heads/main' && inputs.operation == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    # Pre-launch production has no required reviewers so authorized operators can publish with one click.
    # Post-launch, the repo owner can add a human-only required reviewer in GitHub Settings -> Environments -> production without modifying this workflow.
    environment:
      name: production
      url: https://kahut1.web.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact protected main source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git update-ref refs/heads/main "$GITHUB_SHA"
          test "$(git rev-parse refs/heads/main)" = "$GITHUB_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require the production Firebase federation configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test -n "$SERVICE_ACCOUNT"
      - uses: ./.github/actions/assert-oidc-cleanup
        with:
          path: ${{ runner.temp }}/gha-creds.json
      - id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/firebase.database
            https://www.googleapis.com/auth/userinfo.email
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Export scoped Firebase REST token
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_OAUTH_ACCESS_TOKEN"
          printf 'GOOGLE_OAUTH_ACCESS_TOKEN=%s\n' "$GOOGLE_OAUTH_ACCESS_TOKEN" >> "$GITHUB_ENV"
      - name: Keep federation credentials outside the checkout
        run: node scripts/relocate-oidc-credentials.mjs
      - name: Prove the pinned Firebase CLI identity before mutation
        run: node scripts/tooling-where.mjs --exec firebase hosting:sites:list --project temp-a1437 --json >/dev/null
      - name: Materialize the isolated production environment
        env:
          PRODUCTION_ENV: ${{ secrets.LUYENTAP_PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_ENV"
          umask 077
          printf '%s\n' "$PRODUCTION_ENV" > "$RUNNER_TEMP/.env.production"
          test -s "$RUNNER_TEMP/.env.production"
      - name: Observe live Hosting and assess exact candidate
        id: preflight
        env:
          LUYENTAP_RELEASE_CLOUDFLARE_READ_TOKEN: ${{ secrets.LUYENTAP_RELEASE_CLOUDFLARE_READ_TOKEN }}
          LUYENTAP_HOSTING_READBACK_GOOGLE_ACCOUNT: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_SERVICE_ACCOUNT }}
          LUYENTAP_HOSTING_READBACK_GOOGLE_PROVIDER: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          export ENV_FINGERPRINT="$(sha256sum "$RUNNER_TEMP/.env.production" | cut -d' ' -f1)"
          export EXPECTED_TREE="$(git rev-parse 'HEAD^{tree}')"
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import { assess } from './scripts/release-check.mjs';
          import { observeHosting, observeHostingProvider } from './scripts/release-evidence.mjs';
          const observation = await observeHosting();
          const provider = observeHostingProvider();
          const liveProviderIdentity = `${provider.provider.version}@${provider.provider.releaseTime}`;
          if (observation.revision === process.env.GITHUB_SHA
            && observation.tree === process.env.EXPECTED_TREE
            && observation.manifest?.envFingerprint === process.env.ENV_FINGERPRINT) {
            throw new Error('This candidate is already published with this exact environment fingerprint; run operation=verify-existing instead.');
          }
          const assessment = await assess({ cwd: process.cwd(), mode: 'release', target: 'hosting', base: observation.revision,
            hostingObservation: observation, productionEnvFingerprint: process.env.ENV_FINGERPRINT,
            productionEnvFile: `${process.env.RUNNER_TEMP}/.env.production` });
          if (!['PASS', 'NOT_APPLICABLE'].includes(assessment.decision)) {
            throw new Error(`Release assessment is ${assessment.decision}.`);
          }
          const receipt = `tmp/release-receipts/ci-${process.env.GITHUB_RUN_ID}.json`;
          mkdirSync('tmp/release-receipts', { recursive: true });
          writeFileSync(receipt, `${JSON.stringify({ ...assessment, observedProviderIdentity: liveProviderIdentity })}\n`);
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `live_sha=${observation.revision}\nlive_fingerprint=${observation.fingerprint}\nlive_provider_identity=${liveProviderIdentity}\nenv_fingerprint=${process.env.ENV_FINGERPRINT}\n`,
          );
          NODE
      - name: Build the production artifact once
        env:
          LUYENTAP_PRODUCTION_ENV_FILE: ${{ runner.temp }}/.env.production
          LUYENTAP_RELEASE_ASSESSMENT_FILE: tmp/release-receipts/ci-${{ github.run_id }}.json
        run: npm run build:production
      - name: Test and validate the exact production artifact over localhost HTTP
        id: artifact
        run: |
          set -euo pipefail
          preview_origin=http://localhost:5173
          node node_modules/vite/bin/vite.js preview --host localhost --port 5173 --strictPort > "$RUNNER_TEMP/hosting-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          if ! curl --silent --fail --retry 15 --retry-delay 1 --retry-connrefused --max-time 2 "$preview_origin/" >/dev/null; then
            cat "$RUNNER_TEMP/hosting-preview.log" >&2
            exit 1
          fi
          kill -0 "$preview_pid"
          node scripts/release-local-readback.mjs "$preview_origin" > "$RUNNER_TEMP/hosting-readback.json"
          node --input-type=module - "$RUNNER_TEMP/hosting-readback.json" <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { assertHostingArtifact } from './scripts/release-evidence.mjs';
          const readback = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const manifest = JSON.parse(readFileSync('dist/.well-known/luyentap-release.json', 'utf8'));
          await assertHostingArtifact(process.cwd(), manifest);
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `sha256=${readback.manifestSha256}\nmanifest_file_sha256=${readback.manifestFileSha256}\n`,
          );
          NODE
      - name: Publish the verified artifact
        env:
          LUYENTAP_PRODUCTION_ENV_FILE: ${{ runner.temp }}/.env.production
          LUYENTAP_RELEASE_ASSESSMENT_FILE: tmp/release-receipts/ci-${{ github.run_id }}.json
          LUYENTAP_RELEASE_OBSERVED_FINGERPRINT: ${{ steps.preflight.outputs.live_fingerprint }}
          LUYENTAP_RELEASE_OBSERVED_PROVIDER_IDENTITY: ${{ steps.preflight.outputs.live_provider_identity }}
          LUYENTAP_RELEASE_ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          LUYENTAP_RELEASE_OBJECTIVE: ${{ inputs.objective }}
          LUYENTAP_RELEASE_OUTCOME_FILE: ${{ runner.temp }}/release-outcome.json
          LUYENTAP_RELEASE_CLOUDFLARE_READ_TOKEN: ${{ secrets.LUYENTAP_RELEASE_CLOUDFLARE_READ_TOKEN }}
          LUYENTAP_HOSTING_READBACK_GOOGLE_ACCOUNT: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_SERVICE_ACCOUNT }}
          LUYENTAP_HOSTING_READBACK_GOOGLE_PROVIDER: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
        run: npm run deploy:hosting -- --deploy-built
      - name: Summarize Hosting outcome
        if: ${{ always() }}
        env:
          LIVE_SHA: ${{ steps.preflight.outputs.live_sha }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const file = `${process.env.RUNNER_TEMP}/release-outcome.json`;
          const outcome = existsSync(file) ? JSON.parse(readFileSync(file, 'utf8')) : {};
          const lines = [
            '## Hosting publication outcome',
            `- Site URL: ${outcome.siteUrl || 'https://kahut1.web.app'}`,
            `- Source SHA: \`${outcome.revision || process.env.GITHUB_SHA}\``,
            `- Prior live SHA: \`${process.env.LIVE_SHA || 'unavailable'}\``,
            `- Manifest SHA-256: \`${outcome.manifestSha256 || process.env.ARTIFACT_SHA256 || 'unavailable'}\``,
            `- Live version: \`${outcome.liveVersion || 'unavailable'}\``,
            `- Prior version: \`${outcome.priorVersion || 'unavailable'}\``,
            `- Verified files: ${outcome.verifiedFiles ?? 'unavailable'}`,
            `- Operation ID: \`${outcome.operationId || outcome.id || 'unavailable'}\``,
            `- Status: \`${outcome.status || 'not-run'}\``,
            ...(outcome.error ? [`- Error: ${outcome.error}`] : []),
            `- Rollback command: \`${outcome.rollbackCommand || 'firebase hosting:clone temp-a1437:kahut1@<prior-version-id> temp-a1437:kahut1:live --project temp-a1437'}\``,
            `- Verify-existing command: \`${outcome.verifyCommand || 'npm run release:verify-existing -- --operation-id <operation-id> --expected-manifest <manifest-sha256> --expected-revision <git-sha>'}\``,
          ];
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: luyentap-hosting-outcome-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-outcome.json
            tmp/release-receipts/ci-${{ github.run_id }}.json
            ${{ runner.temp }}/hosting-readback.json
          if-no-files-found: ignore
          retention-days: 14

  recover:
    if: ${{ github.repository == 'iamhuwng/autoresync' && github.ref == 'refs/heads/main' && inputs.operation == 'verify-existing' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://kahut1.web.app
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate optional existing-operation bindings
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
          EXPECTED_MANIFEST: ${{ inputs.expected_manifest_sha256 }}
        run: |
          set -euo pipefail
          if [ -n "$OPERATION_ID" ] && ! [[ "$OPERATION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "Invalid operation_id UUID: $OPERATION_ID" >&2
            exit 1
          fi
          if [ -n "$EXPECTED_MANIFEST" ] && ! [[ "$EXPECTED_MANIFEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid expected_manifest_sha256 SHA-256: $EXPECTED_MANIFEST" >&2
            exit 1
          fi
      - name: Require the production Firebase federation configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test -n "$SERVICE_ACCOUNT"
      - uses: ./.github/actions/assert-oidc-cleanup
        with:
          path: ${{ runner.temp }}/gha-creds.json
      - id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.LUYENTAP_PRODUCTION_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/firebase.database
            https://www.googleapis.com/auth/userinfo.email
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Export scoped Firebase REST token
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_OAUTH_ACCESS_TOKEN"
          printf 'GOOGLE_OAUTH_ACCESS_TOKEN=%s\n' "$GOOGLE_OAUTH_ACCESS_TOKEN" >> "$GITHUB_ENV"
      - name: Keep federation credentials outside the checkout
        run: node scripts/relocate-oidc-credentials.mjs
      - name: Verify existing live Hosting without rebuilding or redeploying
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
          EXPECTED_MANIFEST: ${{ inputs.expected_manifest_sha256 }}
          LUYENTAP_RELEASE_OUTCOME_FILE: ${{ runner.temp }}/recovery-outcome.json
        run: |
          set -euo pipefail
          args=(--expected-revision "$GITHUB_SHA" --expected-tree "$(git rev-parse 'HEAD^{tree}')")
          if [ -n "$OPERATION_ID" ]; then args+=(--operation-id "$OPERATION_ID"); fi
          if [ -n "$EXPECTED_MANIFEST" ]; then args+=(--expected-manifest "$EXPECTED_MANIFEST"); fi
          npm run release:verify-existing -- "${args[@]}"
          test -s "$RUNNER_TEMP/recovery-outcome.json"
      - name: Summarize Hosting recovery outcome
        if: ${{ always() }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const file = `${process.env.RUNNER_TEMP}/recovery-outcome.json`;
          const outcome = existsSync(file) ? JSON.parse(readFileSync(file, 'utf8')) : {};
          const lines = [
            '## Hosting verify-existing outcome',
            `- Site URL: ${outcome.siteUrl || 'https://kahut1.web.app'}`,
            `- Source SHA: \`${outcome.revision || process.env.GITHUB_SHA}\``,
            `- Manifest SHA-256: \`${outcome.manifestSha256 || 'unavailable'}\``,
            `- Live version: \`${outcome.providerVersion || 'unavailable'}\``,
            `- Verified files: ${outcome.verifiedFiles ?? 'unavailable'}`,
            `- Operation ID: \`${outcome.operationId || outcome.id || 'none'}\``,
            `- Status: \`${outcome.status || 'not-run'}\``,
            ...(outcome.error ? [`- Error: ${outcome.error}`] : []),
          ];
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: luyentap-release-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-outcome.json
          if-no-files-found: ignore
          retention-days: 14
